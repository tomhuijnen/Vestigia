# Vestigia – bij elke pull request: de datacontrole en de tests in een echte browser (tools/test.mjs).
# Praat nooit met Supabase: de tests blokkeren alle verzoeken naar de database.
name: Tests
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright installeren
        run: |
          npm i -g playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Datacontrole
        run: node tools/controle.mjs
      - name: Tests in de browser
        run: NPM_GLOBAL="$(npm root -g)" node tools/test.mjs --beelden
      - name: Schermafbeeldingen bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schermafbeeldingen
          path: test-uit/
          retention-days: 14
